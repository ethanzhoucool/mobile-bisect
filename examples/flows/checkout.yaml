# Orbit Store checkout flow.
#
# App-side source of truth for the step labels, targets and the assertion.
# This is the canonical flow for the Orbit Store demo, validated against the
# app's real testIDs. `examples/orbit-store/checkout.flow.yaml` mirrors it.
#
# Shape follows docs/revyl-adapter.md: each step is a label plus one Revyl-native
# body, passed through to the runner untouched. `type: instructions` maps to
# `revyl device instruction`, `type: validation` to `revyl device validation`,
# and `type: manual` to a low-level verb such as tap or type. The top-level
# `expect` is the single validation that decides the verdict.
#
# Passes on index 40 (`Preserve checkout navigation`).
# Fails on index 41 (`Refactor order response handling`) — POST /orders still
# returns 200, the app just never leaves Checkout.

name: checkout-flow
appId: orbit-store
expect: the order confirmation screen appears

steps:
  - label: Launch Orbit Store
    type: validation
    step_description: the Orbit Store home screen is showing a featured product card

  - label: Open featured product
    type: instructions
    step_description: tap the large featured product card at the top of the home screen

  - label: Tap "Add to cart"
    type: instructions
    step_description: tap the blue "Add to cart" button in the bottom bar

  - label: Open cart
    type: instructions
    step_description: tap the bag icon in the top right corner

  # Two taps and a text entry in one step, so the labels stay aligned with the
  # CLI fixture, which models this flow as exactly seven steps.
  - label: Apply coupon SAVE10
    type: instructions
    step_description: >-
      Tap "Checkout" in the bottom bar, then type SAVE10 into the promo code
      field and tap "Apply".

  - label: Tap "Place order"
    type: instructions
    step_description: tap the blue "Place order" button in the bottom bar

  - label: Assert order confirmation
    type: validation
    step_description: the heading "Order confirmed" is visible with an order number below it
