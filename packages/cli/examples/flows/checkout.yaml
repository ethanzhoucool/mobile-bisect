# The Orbit Store checkout flow.
#
# `label` is ours: it is the human line rendered under the phone in the report
# and in the terminal. Everything else in a step is the Revyl-native body and is
# passed to the runner untouched, so you can use anything it understands.
#
# `type` says which kind of step it is and `step_description` is the text the
# device acts on, or the claim it checks. A step body the runner cannot execute
# is rejected when this file loads rather than being run as something else.

name: checkout-flow
appId: com.orbit.store

# The sentence every candidate build is judged against. `--expect` overrides it.
expect: the order confirmation screen appears

steps:
  - label: Launch Orbit Store
    type: validation
    step_description: the Orbit Store home screen is showing, with a list of products

  - label: Open featured product
    type: instructions
    step_description: tap the first product card on the home screen

  - label: Tap "Add to cart"
    type: instructions
    step_description: tap the "Add to cart" button on the product page

  - label: Open cart
    type: instructions
    step_description: tap the cart icon in the header

  - label: Apply coupon SAVE10
    type: instructions
    step_description: type SAVE10 into the coupon code field and submit it

  - label: Tap "Place order"
    type: instructions
    step_description: tap the "Place order" button

  - label: Assert order confirmation
    type: validation
    step_description: the "Order confirmed" heading is visible
